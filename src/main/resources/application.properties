# Spring Boot Management API Server Port
server.port=8080

# Application Details
spring.application.name=http-proxy-server

# Proxy Server Engine Configuration
proxy.port=8000
proxy.cache.max-capacity=500
proxy.cache.max-memory-bytes=52428800
proxy.cache.default-ttl-ms=60000
proxy.connect-timeout-ms=5000
proxy.read-timeout-ms=5000

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

